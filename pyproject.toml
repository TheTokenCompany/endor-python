[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endor"
dynamic = ["version"]
description = "Python SDK for Endor: decisions with System One models, and LoRA fine-tuning on your own data"
readme = "README.md"
license = "MIT"
authors = [{ name = "The Token Company", email = "support@thetokencompany.com" }]
requires-python = ">=3.10"
keywords = ["endor", "decision-models", "system-one", "fine-tuning", "lora", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
endor = "endor.cli:main"

[project.urls]
Homepage = "https://thetokencompany.com"
Repository = "https://github.com/TheTokenCompany/endor-python"
Changelog = "https://github.com/TheTokenCompany/endor-python/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/endor/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/endor"]

[tool.hatch.build.targets.sdist]
include = ["src/endor", "tests", "docs", "examples", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:endor"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
